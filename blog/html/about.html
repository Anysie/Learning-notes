<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>关于 · 久安</title>
  <link rel="stylesheet" href="//at.alicdn.com/t/c/font_5215154_lpsum2iex7.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/index.css">
  <link rel="stylesheet" href="../css/background.css">
  <style>

    /* 简介卡片 */
    .about-card{
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 2;
      width: 90%;
      max-width: 720px;
      padding: 2.8rem 2.5rem;
      background-color: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(8px) saturate(1.5);
      -webkit-backdrop-filter: blur(8px) saturate(1.5);
      border-radius: 42px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(90, 120, 150, 0.15);
      text-align: center;
      color: #1a2a3a;
      transition: 0.3s;
    }
    .about-card h1 {
      font-size: 3rem;
      font-weight: 600;
      letter-spacing: 4px;
      margin: 0.3rem 0 0.8rem;
      font-family: 'STXingkai';
      text-shadow: 0 2px 12px rgba(255, 255, 255, 0.6);
    }
    .about-card .copy {
      font-size: 1.1rem;
      font-weight: 400;
      color: #2f4a5a;
      background-color: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(4px);
      display: inline-block;
      padding: 0.25rem 1.8rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin: 1.6rem;
      font-family:monospace;
    }
    .about-card desc i {
      margin-right: 5px;
    }
    .about-card .footer-meta {
      padding-top: 2rem;
      font-family: SimHei;
    }

    .about-avartor .avartor {
      transform: scale(1);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }


  .footer{
    position: relative;
    text-shadow: 0 0 16px rgba(0, 0, 0 , 0.5);
    top: -1rem;
    z-index: 1;
  }

  .back-home {
    position: absolute;
    top: 18px; 
    right: 22px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    padding: 0.4rem 1.2rem 0.4rem 1rem;
    background: rgba(255, 255, 255, 0.18);
    backdrop-filter: blur(6px);
    border-radius: 40px;
    transition: 0.5s;
  }
  .back-home:hover {
    /* font-weight: 600; */
    background: rgba(255, 255, 255, 0.5);
  }
  </style>
</head>


<body>
  <div class="about-wrapper">
    <!-- 背景banner -->
    <div class="bg-blur"></div>

    <!-- 遮罩 -->
    <div class="overlay"></div>

    <!-- 简介 -->
    <div class="about-card">
      <div class="about-avartor">
        <img class="avartor" src="../image/头像.jpg" alt="">
      </div>
      <h1>久安</h1>
      <div class="copy">
        <i class="iconfont icon-shuye"></i> 昭昭如愿 · 岁岁安澜
      </div>
      <div class="desc">
        <i class="iconfont icon-boke"></i> 
        这是一个记录学习笔记与生活点滴的个人网站。<br>
        涵盖 HTML、CSS、JavaScript 等前端学习笔记，<br>
        也会分享一些日常的碎碎念与照片。
      
      </div>
      <div class="footer-meta">
        <span> 2026 · 夏日</span>
      </div>

      <a href="../html/index.html" class="back-home">
        回到首页
      </a>
    </div>
    <!-- 名人名言 -->
    <div class="footer">
      <p class="quote-content"><i class="iconfont icon-mianyiyingguangfenxi"></i>愿岁月忻然，喜乐长久，万事皆安</p>
    </div>

    
      
    
  </div>
    


</body>
</html>
